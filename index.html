<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafbfc"><meta name="apple-mobile-web-app-capable" content="yes"><title>口袋字卡</title><link rel="stylesheet" href="style.css"><script src="words.js" defer></script><script src="app.js" defer></script></head>
<body><main><header><span class="brand">口袋字卡<span class="brand-dot">.</span></span><span id="total">2 張字卡</span></header><div class="deck-label"><span>我的單字</span><span id="position" aria-live="polite"></span></div><article id="card" aria-label="單字卡"><button id="front" aria-label="翻到背面" aria-controls="answer"><span id="word" lang="en"></span></button><div id="answer" hidden><div class="back-heading"><span id="back-word" lang="en"></span><button id="flip-back" aria-label="翻回正面">翻回正面 ↩</button></div><div class="definition"><span id="part" class="tag"></span><p id="phonetic" lang="en"></p><h2 id="meaning"></h2><p id="english" lang="en"></p></div><section class="examples"><h3>例句 <span>03</span></h3><ol id="examples"></ol></section><section class="notes"><div class="notes-heading"><label for="note">我的備註</label><span id="save-state" role="status"></span></div><textarea id="note" rows="3" placeholder="記下你的聯想、用法，或容易忘記的地方…"></textarea><p class="storage-note">備註儲存在此瀏覽器，清除網站資料後會消失。</p></section></div></article><nav aria-label="切換字卡"><button id="prev" aria-label="上一張字卡">← <span>上一張</span></button><div id="dots" aria-hidden="true"></div><button id="next"><span>下一張</span> →</button></nav><p class="hint">左右滑動字卡，換個單字</p><footer>一次一個字，慢慢累積。</footer></main></body></html>
